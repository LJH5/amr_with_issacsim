imu_covariance:
  ros__parameters:
    # Initial variance in (rad/s)^2 for Isaac Sim's all-zero angular covariance.
    fallback_angular_variance: 0.0025
    # Initial orientation variance in rad^2 for Isaac Sim.
    fallback_orientation_variance: 0.0025

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    reset_on_time_jump: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # State groups in order: position, orientation, linear velocity,
    # angular velocity, linear acceleration. Fuse measured wheel twist.
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10

    # Relative yaw anchors the integrated gyro rate when the chassis stops.
    # Enable yaw only when the IMU provides a stable orientation estimate.
    imu0: /imu/with_covariance
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_relative: true
    imu0_queue_size: 10
