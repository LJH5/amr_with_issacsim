# Initial low-speed holonomic tuning, not calibrated hardware limits.
amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan/front
    robot_model_type: nav2_amcl::OmniMotionModel
    tf_broadcast: true
    transform_tolerance: 0.5
    set_initial_pose: false
    always_reset_initial_pose: true
    min_particles: 200
    max_particles: 1000
    max_beams: 60
    laser_model_type: likelihood_field
    laser_min_range: 0.05
    laser_max_range: 20.0
    laser_likelihood_max_dist: 2.0
    update_min_d: 0.05
    update_min_a: 0.1
    save_pose_rate: 0.5

map_server:
  ros__parameters:
    yaml_filename: ''  # Supplied by the map launch argument.

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.2
      max_vel_x: 0.3
      min_vel_y: -0.3
      max_vel_y: 0.3
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.0
      vx_samples: 11
      vy_samples: 7
      vtheta_samples: 15
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.12
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      # Holonomic path following need not rotate the body to face the path tangent.
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, PathDist, GoalDist, Twirling]
      ObstacleFootprint.scale: 0.02
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      Twirling.scale: 1.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      footprint: '[]'  # Filled from amr_description by navigation.launch.py.
      footprint_padding: 0.01
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: front rear
        front:
          topic: /scan/front
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
          max_obstacle_height: 1.5
        rear:
          topic: /scan/rear
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
          max_obstacle_height: 1.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      footprint: '[]'  # Filled from the same canonical footprint as local_costmap.
      footprint_padding: 0.01
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: front rear
        front:
          topic: /scan/front
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
          max_obstacle_height: 1.5
        rear:
          topic: /scan/rear
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
          max_obstacle_height: 1.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    local_frame: odom
    global_frame: map
    transform_tolerance: 0.3
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    max_rotational_vel: 0.6
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: true
    max_velocity: [0.3, 0.3, 0.6]
    min_velocity: [-0.2, -0.3, -0.6]
    max_accel: [0.5, 0.5, 1.0]
    max_decel: [-0.5, -0.5, -1.0]
    odom_topic: /odom
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [FootprintApproach]
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.0
      simulation_time_step: 0.1
      min_points: 4
      visualize: true
      enabled: true
    observation_sources: [front, rear]
    front:
      type: scan
      topic: /scan/front
      min_height: 0.05
      max_height: 1.5
      enabled: true
    rear:
      type: scan
      topic: /scan/rear
      min_height: 0.05
      max_height: 1.5
      enabled: true
